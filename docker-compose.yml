services:
  # ───────────────────────────────────────────────
  # PostgreSQL + pgvector
  # ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: aicard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aicard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # MinIO (S3-compatible file storage)
  # ───────────────────────────────────────────────
  storage:
    image: minio/minio:latest
    container_name: aicard-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # Backend (FastAPI)
  # ───────────────────────────────────────────────
  backend:
    image: kyoozhen/aiprofile-backend:latest
    build:
      context: ./backend
    container_name: aicard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount local source so edits apply live (uvicorn --reload picks them up)
      - ./backend/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aicard}
      MINIO_ENDPOINT: storage:9000
      APP_URL: ${APP_URL:-http://localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  # ───────────────────────────────────────────────
  # Frontend (Next.js)
  # ───────────────────────────────────────────────
  frontend:
    image: kyoozhen/aiprofile-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    entrypoint: ["sh", "-c", "cp -r /app/.next/static /app/.next/standalone/.next/ && cp -r /app/public /app/.next/standalone/ && node /app/.next/standalone/server.js"]
    container_name: aicard-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ───────────────────────────────────────────────
  # Nginx (Reverse Proxy)
  # ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aicard-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  minio_data:
